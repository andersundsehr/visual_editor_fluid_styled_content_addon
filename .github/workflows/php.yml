name: PHP compatibility

on: [push, pull_request]

jobs:
  checks:
    name: "PHP ${{ matrix.php }} / TYPO3 ${{ matrix.typo3 }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        typo3: ['13']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: composer config allow-plugins.typo3/class-alias-loader true
      - run: composer config allow-plugins.typo3/cms-composer-installers true
      - run: composer require "typo3/cms-core:^${{ matrix.typo3 }}" --no-update --no-interaction
      # CI-only alias until TYPO3 accepts the security-fixed svg-sanitize ^1.0.
      - run: TYPO3_SKIP_ASSET_PUBLISH=true composer require "enshrined/svg-sanitize:1.0.0 as 0.22.99" --dev --sort-packages --no-interaction -W
      - run: composer validate --no-check-publish
      - run: composer check-platform-reqs
      # TYPO3 13 uses abandoned doctrine/annotations; still fail on security advisories.
      - run: composer audit --abandoned=report
      - run: bash tests/typo3-svg-sanitizer.sh
      - run: find . -name '*.php' -not -path './vendor/*' -not -path './.git/*' -print0 | xargs -0 -n 1 php -l
